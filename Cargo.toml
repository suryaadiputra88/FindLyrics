[package]
name = "findlyrics"
version = "0.1.0"
edition = "2021"
authors = ["bsa"]
default-run = "findlyrics"
description = "High-performance music lyrics finder and audio tag embedder (FLAC, WAV, MP3, M4A, OGG)"

[lib]
name = "findlyrics"
path = "src/lib.rs"

[[bin]]
name = "findlyrics"
path = "src/main.rs"

[dependencies]
# Audio Tagging Engine
lofty = "0.21"

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI & Interactive Terminal
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
dialoguer = "0.11"
indicatif = "0.17"
colored = "2.1"
walkdir = "2.5"

# Error Handling & Utilities
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.10"


