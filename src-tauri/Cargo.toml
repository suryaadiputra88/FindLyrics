[package]
name = "findlyrics-gui"
version = "0.1.0"
edition = "2021"

[lib]
name = "findlyrics_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-opener = "2.2"
lofty = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
findlyrics = { path = ".." }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
